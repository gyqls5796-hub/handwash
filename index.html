<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>High Score Wash</title>
  <style>
    body {
      margin: 0; padding: 0; background-color: #f0f9ff;
      font-family: 'Arial Rounded MT Bold', -apple-system, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      height: 100vh; overflow: hidden; touch-action: manipulation; user-select: none;
    }

    .header {
      width: 100%; padding: 20px 0; display: none; 
      justify-content: space-around; background: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); z-index: 10;
    }
    .status-box { text-align: center; }
    .status-label { font-size: 0.9rem; color: #94a3b8; letter-spacing: 1px; }
    .status-value { font-size: 2rem; font-weight: 900; color: #0ea5e9; }

    #intro-screen {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; align-items: center; width: 100%; z-index: 100;
    }
    .intro-title { font-size: 2rem; color: #0ea5e9; margin-bottom: 30px; font-weight: bold;}
    .input-group { margin-bottom: 20px; width: 80%; max-width: 300px; }
    .input-group label { display: block; font-size: 1.1rem; color: #475569; margin-bottom: 8px; font-weight: bold;}
    .input-group input {
      width: 100%; padding: 15px; font-size: 1.2rem; border: 2px solid #bae6fd;
      border-radius: 12px; outline: none; text-align: center; box-sizing: border-box;
    }
    .input-group input:focus { border-color: #0ea5e9; }
    
    .start-btn {
      margin-top: 20px; padding: 15px 50px; font-size: 1.5rem; font-weight: bold;
      background-color: #0ea5e9; color: white; border: none; border-radius: 30px;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); cursor: pointer;
    }

    #game-area {
      flex: 1; display: none; flex-direction: column; justify-content: center; align-items: center; width: 100%; position: relative;
    }
    
    .question-text {
      font-size: 1.3rem; color: #0f172a; font-weight: 800; text-align: center;
      margin-bottom: 20px; padding: 0 20px; line-height: 1.4; z-index: 5;
    }

    .hand-container { position: relative; width: 320px; height: 420px; display: flex; justify-content: center; align-items: center; }
    .hand-image {
      width: 100%; height: 100%; object-fit: contain;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.15)); 
      pointer-events: none; 
    }
    
    /* ☁️ 거품 전체 틀 */
    .bubble { 
      position: absolute; 
      width: 54px; height: 30px; 
      cursor: pointer; 
      animation: floatCloud 2.5s infinite ease-in-out alternate; 
      -webkit-tap-highlight-color: transparent; z-index: 10;
    }

    @keyframes floatCloud { 
      0% { transform: translateY(0) scale(1); } 
      100% { transform: translateY(-6px) scale(1.05); } 
    }

    .bubble:nth-child(odd) { animation-delay: -1s; }
    .bubble:nth-child(3n) { animation-delay: -0.5s; }

    /* ☁️ 하얀 구름 거품 모양 */
    .foam {
      position: absolute;
      width: 100%; height: 100%;
      background: #ffffff; border-radius: 30px;
      box-shadow: 0 5px 8px rgba(0,0,0,0.12), inset 0 -4px 6px rgba(186, 230, 253, 0.6);
      z-index: 2; /* 세균보다 앞 */
    }
    .foam::before {
      content: ''; position: absolute;
      top: -12px; left: 8px; width: 24px; height: 24px;
      background: #ffffff; border-radius: 50%;
    }
    .foam::after {
      content: ''; position: absolute;
      top: -18px; right: 6px; width: 32px; height: 32px;
      background: #ffffff; border-radius: 50%;
    }

    /* 🦠 세균 공통 스타일 */
    .germ {
      position: absolute;
      z-index: 1; /* 거품 뒤에 숨기 */
      font-size: 1.5rem;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
    }

    /* 🎯 1. 좌측 상단 빼꼼 */
    .peek-tl { top: -22px; left: -5px; animation: wiggle-tl 2s infinite ease-in-out; }
    @keyframes wiggle-tl { 
      0%, 100% { transform: translateY(0) rotate(-15deg); } 
      50% { transform: translateY(-5px) rotate(10deg); } 
    }

    /* 🎯 2. 우측 상단 빼꼼 */
    .peek-tr { top: -22px; right: -5px; animation: wiggle-tr 2s infinite ease-in-out; }
    @keyframes wiggle-tr { 
      0%, 100% { transform: translateY(0) rotate(15deg); } 
      50% { transform: translateY(-5px) rotate(-10deg); } 
    }

    /* 🎯 3. 좌측면 빼꼼 */
    .peek-l { top: 0px; left: -18px; animation: wiggle-l 2s infinite ease-in-out; }
    @keyframes wiggle-l { 
      0%, 100% { transform: translateX(0) rotate(-35deg); } 
      50% { transform: translateX(-5px) rotate(-15deg); } 
    }

    /* 🎯 4. 우측면 빼꼼 */
    .peek-r { top: 0px; right: -18px; animation: wiggle-r 2s infinite ease-in-out; }
    @keyframes wiggle-r { 
      0%, 100% { transform: translateX(0) rotate(35deg); } 
      50% { transform: translateX(5px) rotate(15deg); } 
    }

    .bubble:nth-child(odd) .germ { animation-delay: -0.7s; }
    .bubble:nth-child(even) .germ { animation-delay: -0.3s; }
    
    .floating-score { position: absolute; font-size: 2rem; font-weight: bold; color: #f59e0b; text-shadow: 0 2px 4px rgba(0,0,0,0.2); pointer-events: none; animation: scoreUp 0.8s forwards; z-index: 20; }
    @keyframes scoreUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-40px) scale(1.5); opacity: 0; } }

    #result-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 50; backdrop-filter: blur(5px); }
    .result-title { font-size: 2rem; color: #0f172a; margin-bottom: 10px; }
    .final-score { font-size: 5rem; font-weight: 900; color: #0ea5e9; margin: 10px 0; }
    .feedback { font-size: 1.2rem; color: #64748b; text-align: center; padding: 0 20px; line-height: 1.5;}
    .stars { font-size: 2.5rem; margin-bottom: 20px; letter-spacing: 5px; }
    .reset-btn { margin-top: 30px; padding: 15px 40px; font-size: 1.2rem; font-weight: bold; background-color: #0ea5e9; color: white; border: none; border-radius: 30px; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); cursor: pointer; }
  </style>
</head>
<body>

  <div id="intro-screen">
    <div class="intro-title">Ready to Wash? 🫧</div>
    <div class="input-group">
      <label>Name</label>
      <input type="text" id="user-name" placeholder="Enter your name">
    </div>
    <div class="input-group">
      <label>Age</label>
      <input type="number" id="user-age" placeholder="Enter your age">
    </div>
    <button class="start-btn" onclick="startGame()">Start!</button>
  </div>

  <div class="header" id="header">
    <div class="status-box"><div class="status-label">POPS LEFT</div><div class="status-value" id="pops-left">3</div></div>
    <div class="status-box"><div class="status-label">SCORE</div><div class="status-value" id="current-score">0</div></div>
  </div>

  <div id="game-area">
    <div class="question-text">Where should we pay more attention to wash?</div>
    
    <div class="hand-container" id="hand">
      <img src="hand.png" alt="Hand Image" class="hand-image">
    </div>
  </div>

  <div id="result-screen">
    <div class="result-title">Your Score</div>
    <div class="final-score" id="final-score-display">0</div>
    <div class="stars" id="star-display">⭐⭐⭐</div>
    <div class="feedback" id="feedback-msg">Awesome!</div>
    <button class="reset-btn" onclick="resetToHome()">Home 🏠</button>
  </div>

  <script>
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwg6YI0G06IpcCW8HHWOdd-gH40BMdgiP8O48xRAVNE8uirN3vq6rn-ty9lm66uJH01/exec";

    const bubbleData = [
      { top: '3%', left: '38%', score: 5, id: '중지끝' },          
      { top: '20%', left: '41%', score: 4, id: '중지마디' },        
      { top: '32%', left: '79%', score: 5, id: '엄지끝' },          
      { top: '38%', left: '17%', score: 4, id: '새끼손가락아래' },   
      { top: '39%', left: '53%', score: 5, id: '검지아래' },        
      { top: '48%', left: '30%', score: 1, id: '손바닥(중앙좌)' },   
      { top: '55%', left: '58%', score: 1, id: '손바닥(중앙우)' },   
      { top: '61%', left: '17%', score: 1, id: '손바닥(좌측하단)' }, 
      { top: '70%', left: '38%', score: 3, id: '손바닥밑동' },      
      { top: '84%', left: '50%', score: 2, id: '손목' }             
    ];

    // 캐릭터 이모지 리스트 (몬스터, 외계인, 악당 등 귀여운 느낌)
    const germCharacters = ['🦠', '👾', '😈', '👽', '👻'];
    
    // 4가지 빼꼼 위치 클래스 리스트
    const peekDirections = ['peek-tl', 'peek-tr', 'peek-l', 'peek-r'];

    let score = 0;
    let popsRemaining = 3;
    let isGameOver = false;
    let clickedHistory = [];
    
    let userName = "";
    let userAge = "";

    const handContainer = document.getElementById('hand');
    const scoreUI = document.getElementById('current-score');
    const popsUI = document.getElementById('pops-left');
    const resultScreen = document.getElementById('result-screen');
    const introScreen = document.getElementById('intro-screen');
    const header = document.getElementById('header');
    const gameArea = document.getElementById('game-area');

    function startGame() {
      userName = document.getElementById('user-name').value.trim();
      userAge = document.getElementById('user-age').value.trim();

      if (userName === "" || userAge === "") {
        alert("Please enter your name and age.");
        return;
      }

      introScreen.style.display = 'none';
      header.style.display = 'flex';
      gameArea.style.display = 'flex';
      initGame();
    }

    function initGame() {
      score = 0;
      popsRemaining = 3;
      isGameOver = false;
      clickedHistory = [];
      
      scoreUI.innerText = score;
      popsUI.innerText = popsRemaining;
      resultScreen.style.display = 'none';
      
      const existingBubbles = document.querySelectorAll('.bubble, .floating-score');
      existingBubbles.forEach(el => el.remove());

      bubbleData.forEach(data => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.style.top = data.top;
        bubble.style.left = data.left;
        
        // 💡 랜덤 캐릭터와 랜덤 빼꼼 위치를 추출합니다!
        const randomCharacter = germCharacters[Math.floor(Math.random() * germCharacters.length)];
        const randomDirection = peekDirections[Math.floor(Math.random() * peekDirections.length)];

        // 빼꼼 위치 클래스(randomDirection)와 캐릭터(randomCharacter)를 동적으로 삽입
        bubble.innerHTML = `
          <div class="germ ${randomDirection}">${randomCharacter}</div>
          <div class="foam"></div>
        `; 
        
        bubble.onclick = (e) => handlePop(e, bubble, data.score, data.id);
        handContainer.appendChild(bubble);
      });
    }

    function handlePop(event, bubbleEl, points, regionId) {
      if (isGameOver || popsRemaining <= 0) return;

      if (navigator.vibrate) navigator.vibrate(40);

      score += points;
      popsRemaining--;
      scoreUI.innerText = score;
      popsUI.innerText = popsRemaining;
      
      clickedHistory.push(regionId);

      bubbleEl.remove();
      showFloatingScore(points, bubbleEl.style.left, bubbleEl.style.top);

      if (popsRemaining === 0) {
        isGameOver = true;
        sendDataToGoogleSheet(userName, userAge, score, clickedHistory);
        setTimeout(showResult, 800); 
      }
    }

    function showFloatingScore(points, left, top) {
      const floatEl = document.createElement('div');
      floatEl.className = 'floating-score';
      floatEl.style.left = left;
      floatEl.style.top = top;
      
      if(points === 5) floatEl.style.color = '#ef4444'; 
      else if(points >= 3) floatEl.style.color = '#f59e0b';
      else floatEl.style.color = '#94a3b8';

      floatEl.innerText = `+${points}`;
      handContainer.appendChild(floatEl);
    }

    function showResult() {
      document.getElementById('final-score-display').innerText = score;
      
      let stars = "";
      let msg = "";

      if (score >= 13) {
        stars = "⭐⭐⭐";
        msg = `Perfect, ${userName}! 🎁<br>You found all the hidden blind spots!`;
      } else if (score >= 8) {
        stars = "⭐⭐";
        msg = `Good job, ${userName}! 👍<br>But don't forget to wash under your fingernails!`;
      } else {
        stars = "⭐";
        msg = `Oops, ${userName}! 😅<br>Washing only the palm isn't enough.`;
      }

      document.getElementById('star-display').innerText = stars;
      document.getElementById('feedback-msg').innerHTML = msg;
      
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      
      resultScreen.style.display = 'flex';
    }

    function resetToHome() {
      document.getElementById('user-name').value = "";
      document.getElementById('user-age').value = "";
      resultScreen.style.display = 'none';
      header.style.display = 'none';
      gameArea.style.display = 'none';
      introScreen.style.display = 'flex';
    }

    function sendDataToGoogleSheet(nameData, ageData, finalScore, historyArray) {
      const dataPayload = {
        name: nameData,
        age: ageData,
        score: finalScore,
        clickedAreas: historyArray
      };

      fetch(GOOGLE_SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(dataPayload)
      })
      .then(() => console.log("전송 완료"))
      .catch(error => console.error("전송 실패:", error));
    }
  </script>
</body>
</html>
